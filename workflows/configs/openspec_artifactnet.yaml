schema_version: 1
provider: openspec_artifactnet
runtime_image: swe-workflow-artifactnet:latest
versions:
  openspec: 1.7.0
  artifactnet: latest
# Reproduces the local Slop-Code-Bench profile: archive publishes the graph
# and moves the change, without applying deltas to canonical openspec/specs.
stages:
  - name: openspec-propose
    arguments:
      - 'Please make the changes for the following task. Do not implement code for this stage.'
      - '{task}'
  - name: openspec-apply-change
    arguments: ['{change_id}']
  - name: openspec-archive-change
    arguments: ['{change_id}']
budgets:
  stage_seconds: 7200
  milestone_seconds: 28800
  max_attempts: 2
artifactnet:
  neo4j_image: neo4j:5-community
  wait_seconds: 600
  llm:
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-5.6-luna
    api_key_env: OPENROUTER_API_KEY
  embedding:
    base_url: https://openrouter.ai/api/v1
    model: openai/text-embedding-3-small
    api_key_env: OPENROUTER_API_KEY
